name: Site Checks

on:
  push:
  pull_request:

jobs:
  site-check:
    name: Site validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm install

      - name: Check publish files against canonical source
        run: python tools/site/sync-site.py --check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify local site asset requests
        run: node tools/site/test-tierlist-network.mjs
